name: Sales Analytics Data Validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sales_analytics
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sales_analytics"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/sales_analytics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate CSV data
        run: python scripts/validate_data.py --out reports/data_quality_report.json
      - name: Execute PostgreSQL schema, load data, and validate analytics queries
        run: python scripts/validate_postgres.py --db "$DATABASE_URL" --data data
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sales-data-quality-report
          path: reports/data_quality_report.json
          if-no-files-found: warn
          retention-days: 7
