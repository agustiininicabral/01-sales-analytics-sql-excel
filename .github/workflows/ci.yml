name: Sales Analytics Data Validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate CSV data
        run: python scripts/validate_data.py --out reports/data_quality_report.json
      - name: Upload validation report
        uses: actions/upload-artifact@v4
        with:
          name: sales-data-quality-report
          path: reports/data_quality_report.json
          if-no-files-found: error
          retention-days: 7
